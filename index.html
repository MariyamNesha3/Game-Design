  <style>
    /* =========================================================
       Mariyam Nesha – Game Design page styles
       ========================================================= */

    /* ---------- 1. Variables & reset ---------- */
    :root {
      --orange: #F47B20;
      --peach: #FFC8A2;
      --brown: #6B5B4F;
      --dark: #161616;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif; background: #fff; color: #111;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ---------- 2. Navbar ---------- */
    .nav-wrap { padding: 40px 70px 0; }
    .navbar {
      max-width: 1300px; margin: 0 auto; height: 86px; padding: 0 8px 0 34px;
      background: var(--dark); border-radius: 50px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar .logo img { height: 100px; }
    .nav-links { display: flex; list-style: none; gap: 10px; }
    .nav-links a {
      display: block; color: #fff; font-size: 20px; padding: 18px 40px; border-radius: 40px;
      transition: background .25s, color .25s;
    }
    .nav-links a:hover { color: var(--orange); }
    .nav-links a.active { background: var(--orange); color: #fff; }

    /* ---------- 3. Intro ---------- */
    main { flex: 1; padding: 0 70px 95px; }
    .intro { text-align: center; max-width: 980px; margin: 76px auto 38px; }
    .intro h1 { font-size: 48px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 30px; }
    .intro h1 span { color: var(--orange); }
    .intro p { font-size: 19px; line-height: 1.6; color: #222; }

    /* ---------- 4. Project cards ---------- */
    .grid {
      max-width: 1300px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 17px;
    }

    .card {
      border-radius: 28px; padding: 8px 8px 0; overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .card.peach { background: var(--peach); color: #111; }
    .card.brown { background: var(--brown); color: #fff; }

    /* No background here: a light background shows through the image's transparent edges as a ring */
    .card .thumb { border-radius: 22px; overflow: hidden; aspect-ratio: 314 / 232; }
    .card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }

    /* If a gap is STILL visible, the PNGs have empty space around them.
       Delete the comment marks around the next two lines to zoom the image slightly and hide that space. */
    /* .card .thumb img { transform: scale(1.06); }
       .card:hover .thumb img { transform: scale(1.09); } */

    .card h3 { font-size: 24px; font-weight: 500; text-align: center; padding: 18px 0 24px; }

    .card:hover { transform: translateY(-6px); box-shadow: 0 14px 30px rgba(0,0,0,.15); }
    .card:hover .thumb img { transform: scale(1.03); }

    /* ---------- 5. Footer ---------- */
    footer {
      background: #000; color: #fff; padding: 16px 60px;   /* shorter footer */
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    }
    footer .copy { font-size: 18px; }
    footer .f-logo img { height: 100px; }   /* same size as the other pages */
    footer .social { display: flex; align-items: center; justify-content: flex-end; gap: 23px; }
    footer .social span { font-size: 18px; font-weight: 500; margin-right: -8px; }
    footer .social img { width: 50px; height: 50px; border-radius: 6px; transition: transform .25s; }
    footer .social a:hover img { transform: translateY(-4px); }

    /* ---------- 6. Responsive: tablet ---------- */
    @media (max-width: 1100px) {
      .nav-links a { padding: 14px 24px; font-size: 18px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ---------- 7. Responsive: mobile ---------- */
    @media (max-width: 720px) {
      .nav-wrap { padding: 20px 16px 0; }
      .navbar { height: auto; padding: 14px 16px; flex-direction: column; gap: 12px; border-radius: 30px; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 4px; }
      .nav-links a { padding: 10px 18px; font-size: 16px; }

      main { padding: 0 16px 60px; }
      .intro { margin-top: 44px; }
      .intro h1 { font-size: 34px; }
      .intro p { font-size: 16px; }
      .intro p br { display: none; }   /* let the sentence wrap naturally on phones */
      .grid { grid-template-columns: 1fr; max-width: 360px; }

      footer { grid-template-columns: 1fr; gap: 22px; text-align: center; padding: 20px 20px; }
      footer .f-logo img { margin: 0 auto; }
      footer .social { justify-content: center; flex-wrap: wrap; gap: 14px; }
    }
  </style>
</head>
